# Alembic CLI settings. Run from the backend folder, e.g.:
#   .\.venv\Scripts\python.exe -m alembic revision --autogenerate -m "add allergies to encounters"
# The database URL comes from backend/.env (see app/migrations/env.py); the backend applies migrations on start.
[alembic]
script_location = app/migrations
file_template = %%(rev)s_%%(slug)s
